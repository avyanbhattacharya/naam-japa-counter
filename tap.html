<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c2d12">
  <meta name="description" content="Free Tap Japa Counter with a large tap button, automatic 108-round tracking, local storage, and no ads. A lightweight digital mantra counter.">
  <meta name="keywords" content="tap japa counter, no ads japa counter, naam japa counter, local lightweight counter, 108 counter, digital mala counter, mantra counter, japa rounds counter">
  <meta property="og:title" content="Tap Japa Counter">
  <meta property="og:description" content="Tap once per naam and automatically track your total and completed rounds of 108. Free, private, and ad-free.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://abhishekb2907.github.io/naam-japa-counter/tap.html">
  <link rel="canonical" href="https://abhishekb2907.github.io/naam-japa-counter/tap.html">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Tap Japa Counter – Free 108 Naam Counter</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; color: #431407; background: linear-gradient(160deg, #fff7ed, #ffedd5); }
    main { width: min(100% - 32px, 440px); padding: 22px; border: 1px solid #fed7aa; border-radius: 28px; background: rgba(255,255,255,.78); box-shadow: 0 18px 55px rgba(124,45,18,.13); text-align: center; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; margin-bottom: 22px; border-radius: 15px; background: #ffedd5; }
    .mode { min-height: 42px; display: grid; place-items: center; border-radius: 11px; color: #7c2d12; text-decoration: none; font-weight: 700; }
    .mode.active { background: white; box-shadow: 0 2px 7px rgba(124,45,18,.12); }
    h1 { margin: 0 0 18px; font-size: 1.45rem; }
    .label { color: #9a3412; }
    #count { margin: 2px 0 18px; font-size: clamp(4rem, 22vw, 7rem); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .metric { padding: 13px 8px; border-radius: 16px; background: #ffedd5; }
    .metric-label { color: #9a3412; font-size: .78rem; }
    .metric-value { margin-top: 3px; font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .progress-copy { display: flex; justify-content: space-between; margin-bottom: 7px; color: #7c2d12; font-size: .82rem; }
    .track { height: 9px; overflow: hidden; border-radius: 999px; background: #fed7aa; }
    #round-progress { width: 0; height: 100%; background: #c2410c; transition: width .15s ease; }
    #tap { width: 100%; min-height: 178px; margin-top: 20px; border: 0; border-radius: 28px; background: linear-gradient(145deg, #9a3412, #c2410c); color: white; box-shadow: 0 8px 0 #7c2d12, 0 16px 30px rgba(124,45,18,.23); font: inherit; cursor: pointer; touch-action: manipulation; user-select: none; }
    #tap:active { transform: translateY(5px); box-shadow: 0 3px 0 #7c2d12, 0 9px 18px rgba(124,45,18,.2); }
    .tap-main { display: block; font-size: 2.15rem; font-weight: 700; }
    .tap-sub { display: block; margin-top: 8px; font-size: .88rem; opacity: .9; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; }
    .status { color: #9a3412; font-size: .88rem; font-weight: 700; }
    #reset { min-height: 44px; padding: 0 18px; border-radius: 13px; border: 1px solid #fdba74; background: white; color: #7c2d12; font: inherit; font-weight: 700; }
    .note { margin: 18px 0 0; font-size: .86rem; line-height: 1.45; color: #7c2d12; }
  </style>
</head>
<body>
  <main>
    <nav class="modes" aria-label="Counter mode">
      <a class="mode" href="./">Touchless</a>
      <a class="mode active" href="tap.html" aria-current="page">Tap</a>
    </nav>
    <h1>Tap Japa Counter</h1>
    <div class="label">Total naam</div>
    <div id="count" aria-live="polite">0</div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Rounds completed</div><div id="rounds" class="metric-value">0</div></div>
      <div class="metric"><div class="metric-label">Current round</div><div id="current-round" class="metric-value">0 / 108</div></div>
    </div>
    <div class="progress-copy"><span id="round-label">Round 1 progress</span><span id="round-percent">0%</span></div>
    <div class="track" role="progressbar" aria-label="Current round progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="108"><div id="round-progress"></div></div>
    <button id="tap" type="button"><span class="tap-main">TAP +1</span><span class="tap-sub">Tap once for each naam</span></button>
    <div class="footer"><span class="status">Every tap is saved</span><button id="reset" type="button">Reset</button></div>
    <p class="note">A free, private, lightweight, no-ads japa counter. Your count stays in this browser.</p>
  </main>

  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebApplication","name":"Tap Japa Counter","url":"https://abhishekb2907.github.io/naam-japa-counter/tap.html","applicationCategory":"LifestyleApplication","operatingSystem":"Any","description":"A free, no-ads, lightweight tap counter for Naam Japa with automatic 108-round tracking.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
  </script>
  <script>
    (() => {
      const storageKey = 'tap-japa-counter-state-v1';
      const countEl = document.querySelector('#count');
      const roundsEl = document.querySelector('#rounds');
      const currentRoundEl = document.querySelector('#current-round');
      const roundLabelEl = document.querySelector('#round-label');
      const roundPercentEl = document.querySelector('#round-percent');
      const roundProgressEl = document.querySelector('#round-progress');
      const roundTrackEl = document.querySelector('.track');
      let count = loadCount();

      function loadCount() {
        const saved = Number(localStorage.getItem(storageKey));
        return Number.isSafeInteger(saved) && saved >= 0 ? saved : 0;
      }
      function saveCount() { localStorage.setItem(storageKey, String(count)); }
      function render() {
        const rounds = Math.floor(count / 108);
        const current = count % 108;
        const percent = Math.floor(current / 108 * 100);
        countEl.textContent = count.toLocaleString();
        roundsEl.textContent = rounds.toLocaleString();
        currentRoundEl.textContent = `${current} / 108`;
        roundLabelEl.textContent = `Round ${rounds + 1} progress`;
        roundPercentEl.textContent = `${percent}%`;
        roundProgressEl.style.width = `${current / 108 * 100}%`;
        roundTrackEl.setAttribute('aria-valuenow', current);
      }
      document.querySelector('#tap').addEventListener('click', () => { count += 1; saveCount(); render(); });
      document.querySelector('#reset').addEventListener('click', () => {
        if (count && !confirm('Reset the count to zero?')) return;
        count = 0; saveCount(); render();
      });
      render();
    })();
  </script>
</body>
</html>
