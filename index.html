<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c2d12">
  <meta name="description" content="A simple hands-free Naam Japa counter that counts using elapsed time.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Naam Japa Counter</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; color: #431407; background: linear-gradient(160deg, #fff7ed, #ffedd5); }
    main { width: min(100% - 32px, 440px); padding: 28px 22px; border: 1px solid #fed7aa; border-radius: 28px; background: rgba(255,255,255,.78); box-shadow: 0 18px 55px rgba(124,45,18,.13); text-align: center; }
    h1 { margin: 0 0 26px; font-size: 1.45rem; }
    .label, .rate { color: #9a3412; }
    #count { margin: 4px 0; font-size: clamp(4rem, 22vw, 7rem); line-height: 1; font-variant-numeric: tabular-nums; }
    #elapsed { margin: 14px 0 6px; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 28px; }
    button { min-height: 52px; border: 1px solid #fdba74; border-radius: 15px; background: white; color: #7c2d12; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { border-color: #9a3412; background: #9a3412; color: white; }
    button:disabled { opacity: .45; cursor: default; }
    #status { margin: 18px 0 0; min-height: 24px; font-weight: 650; color: #9a3412; }
    .note { margin: 18px 0 0; font-size: .86rem; line-height: 1.45; color: #7c2d12; }
  </style>
</head>
<body>
  <main>
    <h1>Naam Japa Counter</h1>
    <div class="label">Naam count</div>
    <div id="count" aria-live="polite">0</div>
    <div id="elapsed">00:00:00</div>
    <div class="rate">1 naam every 2 seconds · 1,800 per hour</div>

    <div class="buttons">
      <button id="start" class="primary" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <div id="status" aria-live="polite">Ready</div>
    <p class="note">On iPhone, the display may freeze while the screen is locked. When you return, the count catches up automatically from the real elapsed time.</p>
  </main>

  <script>
    (() => {
      const MS_PER_NAAM = 2000;
      const storageKey = 'naam-japa-counter-state-v1';
      const countEl = document.querySelector('#count');
      const elapsedEl = document.querySelector('#elapsed');
      const statusEl = document.querySelector('#status');
      const startBtn = document.querySelector('#start');
      const pauseBtn = document.querySelector('#pause');
      const resetBtn = document.querySelector('#reset');

      let state = loadState();
      let displayTimer;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          if (saved && Number.isFinite(saved.accumulatedMs)) {
            return { running: Boolean(saved.running), startedAt: saved.startedAt, accumulatedMs: saved.accumulatedMs };
          }
        } catch (_) {}
        return { running: false, startedAt: null, accumulatedMs: 0 };
      }

      function saveState() { localStorage.setItem(storageKey, JSON.stringify(state)); }

      function elapsedMs() {
        return state.accumulatedMs + (state.running && state.startedAt ? Math.max(0, Date.now() - state.startedAt) : 0);
      }

      function formatTime(ms) {
        const total = Math.floor(ms / 1000);
        const hours = String(Math.floor(total / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
        const seconds = String(total % 60).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      }

      function render() {
        const elapsed = elapsedMs();
        countEl.textContent = Math.floor(elapsed / MS_PER_NAAM).toLocaleString();
        elapsedEl.textContent = formatTime(elapsed);
        statusEl.textContent = state.running ? 'Japa counting' : elapsed ? 'Paused' : 'Ready';
        startBtn.disabled = state.running;
        pauseBtn.disabled = !state.running;
      }

      function runDisplayTimer() {
        clearInterval(displayTimer);
        if (state.running) displayTimer = setInterval(render, 250);
      }

      startBtn.addEventListener('click', () => {
        if (state.running) return;
        state.running = true;
        state.startedAt = Date.now();
        saveState(); render(); runDisplayTimer();
      });

      pauseBtn.addEventListener('click', () => {
        if (!state.running) return;
        state.accumulatedMs = elapsedMs();
        state.running = false;
        state.startedAt = null;
        saveState(); clearInterval(displayTimer); render();
      });

      resetBtn.addEventListener('click', () => {
        if (elapsedMs() && !confirm('Reset the count to zero?')) return;
        state = { running: false, startedAt: null, accumulatedMs: 0 };
        saveState(); clearInterval(displayTimer); render();
      });

      document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); runDisplayTimer(); } });
      window.addEventListener('pageshow', () => { render(); runDisplayTimer(); });
      render(); runDisplayTimer();
    })();
  </script>
</body>
</html>
